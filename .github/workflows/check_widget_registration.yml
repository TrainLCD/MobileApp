name: Check canary widget registration
on:
  push:
    branches: [diagnose/ios-3038-upload]
    paths: [.github/workflows/check_widget_registration.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check App Store Connect registration
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          SIGNING_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import { sign } from 'node:crypto';
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const payload = encode({alg:'ES256',kid:process.env.KEY_ID,typ:'JWT'}) + '.' + encode({iss:process.env.ISSUER,iat:now-10,exp:now+120,aud:'appstoreconnect-v1'});
          const signature = sign('sha256',Buffer.from(payload),{key:Buffer.from(process.env.SIGNING_KEY,'base64'),dsaEncoding:'ieee-p1363'}).toString('base64url');
          const identifier = 'me.tinykitten.trainlcd.dev.watchkitapp.watchwidget';
          const api = async (path,data) => {
            const res = await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+payload+'.'+signature,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined,redirect:'error'});
            const b=await res.json(); if(!res.ok) throw Error(res.status+' '+JSON.stringify(b.errors.map(e=>[e.code,e.detail]))); return b.data;
          };
          const lookup=async id=>(await api('bundleIds?filter[identifier]='+id))[0];
          const previous=await lookup(identifier.replace('.watchwidget','.watchkitextension.watchwidget'));
          if(!previous)throw Error('Previous widget identifier not found');
          let widget=await lookup(identifier);
          if(!widget) widget=await api('bundleIds',{type:'bundleIds',attributes:{identifier,name:'TrainLCD Canary Watch Widget',platform:previous.attributes.platform}});
          console.log('Widget registration confirmed',widget.attributes.identifier);
          const caps=await api('bundleIds/'+widget.id+'/bundleIdCapabilities');
          if(!caps.some(x=>x.attributes.capabilityType==='APP_GROUPS'))await api('bundleIdCapabilities',{type:'bundleIdCapabilities',attributes:{capabilityType:'APP_GROUPS'},relationships:{bundleId:{data:{type:'bundleIds',id:widget.id}}}});
          console.log('APP_GROUPS capability enabled');
          let template;
          for(const id of [previous.attributes.identifier,identifier.replace('.watchwidget',''),'me.tinykitten.trainlcd.dev']){
           const target=await lookup(id);const list=await api('bundleIds/'+target.id+'/profiles?limit=200&fields[profiles]=profileState,profileType,expirationDate');
           template=list.filter(p=>p.attributes.profileState==='ACTIVE'&&p.attributes.profileType==='IOS_APP_DEVELOPMENT').sort((a,b)=>b.attributes.expirationDate.localeCompare(a.attributes.expirationDate))[0];
           console.log('Development profile found',id,!!template);
           if(template)break;
          }
          if(!template)throw Error('No active development profile');
          const existing=await api('bundleIds/'+widget.id+'/profiles?limit=200');
          const type='IOS_APP_DEVELOPMENT';
          let profile=existing.find(p=>p.attributes.profileType===type&&p.attributes.profileState==='ACTIVE');
          if(!profile) {
           const links=async rel=>(await api('profiles/'+template.id+'/'+rel+'?limit=200')).map(({id,type})=>({id,type}));
           const certificates=await links('certificates'),devices=await links('devices');
           profile=await api('profiles',{type:'profiles',attributes:{name:'TrainLCD Canary Watch Widget Development 3038',profileType:type},relationships:{bundleId:{data:{type:'bundleIds',id:widget.id}},certificates:{data:certificates},devices:{data:devices}}});
          }
          const {execFileSync}=await import('node:child_process');
          const plist=execFileSync('openssl',['cms','-verify','-inform','DER','-noverify'],{input:Buffer.from(profile.attributes.profileContent,'base64'),stdio:['pipe','pipe','ignore']});
          const check=execFileSync('python3',['-c',"import plistlib,sys; e=plistlib.loads(sys.stdin.buffer.read())['Entitlements']; print('GROUP_AUTHORIZED', 'group.me.tinykitten.trainlcd.dev' in e.get('com.apple.security.application-groups', []))"],{input:plist}).toString().trim();
          console.log('Development profile',profile.attributes.profileState,check);
          JS
