# Prerequisites and dry-run procedure: docs/android-build-workflows.md
name: Build Android Canary

env:
  STAGING_API_URL: "${{ secrets.STAGING_API_URL }}"
  DEV_ROUTE_RESOLVER_API_URL: "${{ secrets.DEV_ROUTE_RESOLVER_API_URL }}"
  DEV_WORKER_API_URL: "${{ secrets.DEV_WORKER_API_URL }}"
  ENABLE_EXPERIMENTAL_TELEMETRY: "${{ secrets.ENABLE_EXPERIMENTAL_TELEMETRY }}"
  EXPERIMENTAL_TELEMETRY_ENDPOINT_URL: "${{ secrets.EXPERIMENTAL_TELEMETRY_ENDPOINT_URL }}"

on:
  push:
    branches:
      - canary
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload the AAB to Google Play (internal track)"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-android-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Setup SSH for submodules
        # v0.9.1
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}

      - name: Use SSH for GitHub submodules
        run: git config --global url."git@github.com:TrainLCD/MobileAppFonts.git".insteadOf "https://github.com/TrainLCD/MobileAppFonts.git"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Revoke submodule SSH access
        run: |
          git config --global --unset-all url."git@github.com:TrainLCD/MobileAppFonts.git".insteadOf || true
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" || true
          fi
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        # v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Decode Sentry properties
        env:
          SENTRY_PROPERTIES_CONTENT: ${{ secrets.SENTRY_PROPERTIES_BASE64 }}
        run: printf '%s' "$SENTRY_PROPERTIES_CONTENT" | base64 --decode > android/sentry.properties

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_CONTENT: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p android/app
          printf '%s' "$RELEASE_KEYSTORE_CONTENT" | base64 --decode > android/app/release.jks
          chmod 600 android/app/release.jks

      - name: Configure signing properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.gradle"
          python3 - <<'PY'
          import os

          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")

          entries = {
              "TRAINLCD_UPLOAD_STORE_FILE": "release.jks",
              "TRAINLCD_UPLOAD_STORE_PASSWORD": os.environ["STORE_PASSWORD"],
              "TRAINLCD_UPLOAD_KEY_ALIAS": os.environ["KEY_ALIAS"],
              "TRAINLCD_UPLOAD_KEY_PASSWORD": os.environ["KEY_PASSWORD"],
          }

          path = os.path.expanduser("~/.gradle/gradle.properties")
          with open(path, "a") as f:
              for key, value in entries.items():
                  f.write(f"{key}={escape(value)}\n")
          os.chmod(path, 0o600)
          PY

      - name: Validate build environment
        run: |
          required_variables=(
            STAGING_API_URL
            DEV_ROUTE_RESOLVER_API_URL
            DEV_WORKER_API_URL
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::Required environment variable is not configured: $variable_name"
              exit 1
            fi
          done

      # :wearable は :app と applicationId が同一のマルチバンドル配信のため、Play の同一
      # リリースに両方の AAB を含める必要がある。:app 単体で公開すると Wear OS トラックに
      # android.hardware.type.watch を宣言した AAB が存在せず、既存 Wear ユーザーへ
      # アップグレードを提供できずリリースが公開ブロックされる。
      - name: Build devRelease
        working-directory: android
        env:
          EXPERIMENTAL_TELEMETRY_TOKEN: "${{ secrets.EXPERIMENTAL_TELEMETRY_TOKEN }}"
        run: ./gradlew :app:bundleDevRelease :wearable:bundleDevRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-devRelease
          path: android/app/build/outputs/bundle/devRelease/*.aab
          if-no-files-found: error

      - name: Upload Wear OS AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wearable-devRelease
          path: android/wearable/build/outputs/bundle/devRelease/*.aab
          if-no-files-found: error

      # releaseFiles は「カンマ区切りのみ・要素の trim なし」で解釈されるため、改行や
      # 余分な空白を挟まず 1 行で列挙する。
      # mappingFile は指定すると各 versionCode へ同一ファイルが適用され、:wearable に
      # :app のマッピングが貼られてしまう。両モジュールとも R8 有効
      # (android.enableMinifyInReleaseBuilds=true) で AAB 内の
      # BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map を Play が
      # 自動で取り込むため、明示指定はしない。
      - name: Upload to Google Play (internal track)
        if: github.event_name == 'push' || inputs.upload_to_play
        # v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.tinykitten.trainlcd.dev
          releaseFiles: "android/app/build/outputs/bundle/devRelease/*.aab,android/wearable/build/outputs/bundle/devRelease/*.aab"
          tracks: internal
          status: completed
