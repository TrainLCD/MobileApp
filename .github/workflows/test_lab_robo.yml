# Firebase Test Lab の Robo テストを既存の canary ビルド成果物に対して実行する。
# Robo はクローラなので、テストコードも testID の配線も無しに動く。複数機種での
# 起動時クラッシュと初期導線の到達可否を、端末を接続せずに確認するのが目的。
#
# ビルドはしない。Build Android Canary が既に artifact として上げた AAB を
# run ID 指定で取りに行くだけなので、ビルドワークフローには一切手を入れない。
#
# 手動実行のみ。Test Lab は端末時間で課金されるため、push で自動的に走らせない。
name: Firebase Test Lab (Robo)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build Android Canary の run ID (app-devRelease アーティファクトの取得元)"
        required: true
        type: string
      devices:
        description: "gcloud firebase test の --device 指定"
        required: false
        default: "--device model=MediumPhone.arm,version=34 --device model=MediumPhone.arm,version=30"
        type: string

permissions:
  contents: read

jobs:
  robo:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      # 別 run の artifact を取得するために必要。
      actions: read
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-devRelease
          path: test-lab-app
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Test Lab environment
        env:
          TEST_LAB_SERVICE_ACCOUNT_JSON: "${{ secrets.TEST_LAB_SERVICE_ACCOUNT_JSON }}"
        run: |
          if [ -z "${TEST_LAB_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Required secret is not configured: TEST_LAB_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        env:
          TEST_LAB_SERVICE_ACCOUNT_JSON: "${{ secrets.TEST_LAB_SERVICE_ACCOUNT_JSON }}"
        run: |
          key_file="$RUNNER_TEMP/test-lab-service-account.json"
          printf '%s' "$TEST_LAB_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"

          # プロジェクト ID は鍵から読む。サービスアカウントは Test Lab を動かす
          # Firebase プロジェクトに属するので、別途 secret を増やすより食い違わない。
          project_id="$(KEY_FILE="$key_file" python3 -c 'import json,os,sys; sys.stdout.write(json.load(open(os.environ["KEY_FILE"]))["project_id"])')"
          if [ -z "$project_id" ]; then
            echo "::error::project_id is missing from TEST_LAB_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          gcloud auth activate-service-account --key-file="$key_file"
          gcloud config set project "$project_id"
          echo "TEST_LAB_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - name: Run Robo test
        env:
          # 端末の型番はカタログから退役する。`model ... is not a valid model id` で
          # 落ちたら `gcloud firebase test android models list` で現行の型番を確認する。
          TEST_LAB_DEVICES: "${{ inputs.devices }}"
        run: |
          aab="$(find test-lab-app -name '*.aab' -print -quit)"
          if [ -z "$aab" ]; then
            echo "::error::No AAB found in the downloaded artifact"
            exit 1
          fi

          # 未引用のまま展開すると word splitting と同時に pathname expansion も
          # 効き、`*` などを含む指定が runner 上のパス名へ化ける。配列へ分解して
          # 複数の --device は保ったまま glob だけ止める。
          read -r -a device_args <<< "$TEST_LAB_DEVICES"

          # ここから先は「Test Lab への送信に到達した」として扱う。Robo がクラッシュを
          # 検出すると gcloud は非ゼロ終了するが結果は残るので、終了コードではなく
          # 到達したかどうかを記録する。Link Test Lab results はこれを見る。
          echo "TEST_LAB_SUBMITTED=1" >> "$GITHUB_ENV"

          # --grant-permissions all を付けないと、Robo が位置情報の許可ダイアログで
          # 足止めされて初期導線より先へ進めない。
          gcloud firebase test android run \
            --type robo \
            --app "$aab" \
            "${device_args[@]}" \
            --grant-permissions all \
            --timeout 10m \
            --results-history-name "TrainLCD Canary"

      - name: Link Test Lab results
        if: always()
        run: |
          {
            echo "## Firebase Test Lab"
            echo
            if [ "${TEST_LAB_SUBMITTED:-}" = "1" ]; then
              echo "スクリーンショット・動画・logcat は Test Lab コンソールに残る。"
              echo "ジョブのログ先頭に出る results URL か、以下から辿る。"
              echo
              echo "<https://console.firebase.google.com/project/$TEST_LAB_PROJECT_ID/testlab/histories/>"
            else
              # 送信に到達していない場合。認証前に落ちたときと、認証後に AAB が
              # 見つからず終了したときの両方がここへ来る。履歴 URL を出すと今回の
              # 実行結果として読めてしまうので出さない。
              echo "Test Lab へ送信する前に終了したため、今回の結果は残っていない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
