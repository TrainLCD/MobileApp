name: Inspect TestFlight validation
on:
  push:
    branches: [diagnose/ios-3038-upload]
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read validation messages from upload step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 44854707160 --repo TrainLCD/MobileApp --job 136694063959 --log-failed | grep -F 'Upload to TestFlight' | tail -70
