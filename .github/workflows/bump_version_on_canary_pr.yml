name: Bump Version on Canary PR

on:
  pull_request:
    types: opened
    branches:
      - canary
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target PR number"
        required: true
        type: string
      head_ref:
        description: "Source branch name of target PR"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  TZ: "Asia/Tokyo"

jobs:
  bump-version:
    runs-on: ubuntu-22.04
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || github.event_name == 'workflow_dispatch'
    steps:
      # gh pr create applies labels after creating the PR, in a separate API call.
      - name: Wait for skip-version-bump label
        id: canary-label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            labels="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
              --paginate --jq '.[].name')"
            if grep -Fx 'skip-version-bump' <<< "$labels" >/dev/null; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo 'skip=false' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.canary-label.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.canary-label.outputs.skip != 'true'
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        if: steps.canary-label.outputs.skip != 'true'
        run: npm ci

      - name: Bump version
        if: steps.canary-label.outputs.skip != 'true'
        run: |
          set -e
          npm run version:bump -- --no-version-increment

      - name: Create Pull Request
        if: steps.canary-label.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bump version for canary release"
          title: "chore: Bump version for PR #${{ github.event.pull_request.number || inputs.pr_number }}"
          body: |
            This PR was automatically created by the bump version workflow.

            It bumps the version number for the canary release.

            **Related PR:** #${{ github.event.pull_request.number || inputs.pr_number }}

            Please merge this PR into the source branch of PR #${{ github.event.pull_request.number || inputs.pr_number }} to update its version numbers.
          branch: "auto-version-bump-${{ github.event.pull_request.number || inputs.pr_number }}"
          base: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          delete-branch: true
          labels: |
            automated
            version-bump
          assignees: TinyKitten
