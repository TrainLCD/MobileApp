name: Diagnose iOS Release startup

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose_ios_startup.yml'

permissions:
  contents: read

jobs:
  startup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 50
    env:
      APP_VARIANT: dev
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      DEV_ROUTE_RESOLVER_API_URL: ${{ secrets.DEV_ROUTE_RESOLVER_API_URL }}
      DEV_WORKER_API_URL: ${{ secrets.DEV_WORKER_API_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.FONTS_SSH_KEY }}
      - name: Configure Fonts access
        run: git config --global url."git@github.com:TrainLCD/MobileAppFonts.git".insteadOf "https://github.com/TrainLCD/MobileAppFonts.git"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Revoke Fonts access
        run: |
          git config --global --unset-all url."git@github.com:TrainLCD/MobileAppFonts.git".insteadOf || true
          kill "$SSH_AGENT_PID" || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ios:frameworks
      - run: pod install --repo-update
        working-directory: ios
      - name: Restore Firebase configuration
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          mkdir -p ios/Schemes/Dev
          printf '%s' "$FIREBASE_PLIST" | base64 --decode > ios/Schemes/Dev/GoogleService-Info.plist
      - name: Build unsigned Release for simulator
        run: |
          xcodebuild -workspace ios/TrainLCD.xcworkspace -scheme CanaryTrainLCD \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/startup-build" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/startup-build.log" 2>&1
      - name: Launch and collect runtime evidence
        run: |
          mkdir -p "$RUNNER_TEMP/startup-evidence"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/startup-build/Build/Products/Release-iphonesimulator/CanaryTrainLCD.app"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" me.tinykitten.trainlcd.dev
          sleep 35
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/startup-evidence/screen.png"
          xcrun simctl spawn "$DEVICE_ID" log show --last 3m --style compact \
            --predicate 'process == "CanaryTrainLCD" OR eventMessage CONTAINS "SceneDelegate"' \
            > "$RUNNER_TEMP/startup-runtime.log" 2>&1
      - name: Sanitize diagnostic logs
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          fs.mkdirSync(`${root}/startup-evidence`, { recursive: true });
          for (const name of ['startup-build', 'startup-runtime']) {
            const input = `${root}/${name}.log`;
            if (!fs.existsSync(input)) continue;
            let text = fs.readFileSync(input, 'utf8');
            for (const key of ['STAGING_API_URL', 'DEV_ROUTE_RESOLVER_API_URL', 'DEV_WORKER_API_URL', 'SENTRY_DSN']) {
              if (process.env[key]) text = text.replaceAll(process.env[key], '[REDACTED]');
            }
            text = text.replace(/https?:\/\/[^\s"'<>]+/g, '[URL]').replace(/AIza[\w-]{35}/g, '[REDACTED]');
            fs.writeFileSync(`${root}/startup-evidence/${name}.log`, text);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-startup-evidence
          path: ${{ runner.temp }}/startup-evidence
          retention-days: 3
