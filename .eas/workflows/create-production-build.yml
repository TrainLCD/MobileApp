name: Create iOS Production Build
on:
  push:
    branches:
      - master

jobs:
  build_ios:
    type: build
    environment: production
    params:
      platform: ios
      profile: production
    steps:
      - uses: eas/checkout
      - name: Checkout submodules
        run: |
          set -euo pipefail
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - name: Decode Sentry properties
        run: |
          if [ -z "${SENTRY_PROPERTIES_BASE64:-}" ]; then
            echo "Environment variable SENTRY_PROPERTIES_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$SENTRY_PROPERTIES_BASE64" | base64 --decode > ios/sentry.properties
      - uses: eas/build

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production